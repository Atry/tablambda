version = 1
revision = 3
requires-python = ">=3.11"
resolution-markers = [
    "python_full_version == '3.12.*' and implementation_name == 'cpython'",
    "python_full_version >= '3.14' and implementation_name == 'cpython'",
    "(python_full_version < '3.12' and implementation_name == 'cpython') or (python_full_version == '3.13.*' and implementation_name == 'cpython')",
    "python_full_version == '3.12.*' and implementation_name == 'pypy'",
    "python_full_version >= '3.14' and implementation_name == 'pypy'",
    "(python_full_version < '3.12' and implementation_name == 'pypy') or (python_full_version == '3.13.*' and implementation_name == 'pypy')",
]
supported-markers = [
    "implementation_name == 'cpython'",
    "implementation_name == 'pypy'",
]

[manifest]
members = [
    "fixpoints",
    "tablambda",
    "tablambda-examples",
    "tablambda-workspace",
]

[[package]]
name = "fixpoints"
source = { editable = "packages/fixpoints" }

[[package]]
name = "tablambda"
source = { editable = "packages/tablambda" }
dependencies = [
    { name = "fixpoints", marker = "implementation_name == 'cpython' or implementation_name == 'pypy'" },
    { name = "typing-extensions", marker = "implementation_name == 'cpython' or implementation_name == 'pypy'" },
]

[package.metadata]
requires-dist = [
    { name = "fixpoints", editable = "packages/fixpoints" },
    { name = "typing-extensions", specifier = ">=4.1.0" },
]

[[package]]
name = "tablambda-examples"
version = "0.0.0.dev0"
source = { editable = "packages/tablambda-examples" }
dependencies = [
    { name = "tablambda", marker = "implementation_name == 'cpython' or implementation_name == 'pypy'" },
]

[package.metadata]
requires-dist = [{ name = "tablambda", editable = "packages/tablambda" }]

[[package]]
name = "tablambda-workspace"
version = "0.0.0.dev0"
source = { virtual = "." }
dependencies = [
    { name = "tablambda", marker = "implementation_name == 'cpython' or implementation_name == 'pypy'" },
    { name = "tablambda-examples", marker = "implementation_name == 'cpython' or implementation_name == 'pypy'" },
]

[package.metadata]
requires-dist = [
    { name = "tablambda", editable = "packages/tablambda" },
    { name = "tablambda-examples", editable = "packages/tablambda-examples" },
]

[[package]]
name = "typing-extensions"
version = "4.15.0"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://files.pythonhosted.org/packages/72/94/1a15dd82efb362ac84269196e94cf00f187f7ed21c242792a923cdb1c61f/typing_extensions-4.15.0.tar.gz", hash = "sha256:0cea48d173cc12fa28ecabc3b837ea3cf6f38c6d1136f85cbaaf598984861466", size = 109391, upload-time = "2025-08-25T13:49:26.313Z" }
wheels = [
